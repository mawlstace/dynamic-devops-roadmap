apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beekeeper-ingress
  namespace: beekeeper
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Uncomment the following line to enforce SSL redirect for HTTPS
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: beekeeper.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beekeeper-service
            port:
              number: 80

---
apiVersion: v1
kind: Service
metadata:
  name: beekeeper-service
  namespace: beekeeper
spec:
  selector:
    app: beekeeper
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beekeeper
  namespace: beekeeper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beekeeper
  template:
    metadata:
      labels:
        app: beekeeper
    spec:
      containers:
      - name: beekeeper
        image: mawlstace/beekeeper-api:latest  # Replace with your image name and tag
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        # Uncomment below to enforce security best practices
        # securityContext:
        #   runAsNonRoot: true
        #   runAsUser: 1000
        #   allowPrivilegeEscalation: false
        #   capabilities:
        #     drop:
        #       - ALL

